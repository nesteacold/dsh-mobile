# Spec 011 parity (references 01/02/03) — the session list.
#
# REWRITTEN: the bottom tab bar is gone and the filter tabs (running / idle / archived) with it. The
# list is now the app's single main screen, grouped into collapsible sections, so the old
# "switch to this tab then assert visibility" steps no longer exist. What this flow still proves is
# the part that matters: every canonical session row is reachable by its stable hook, and the row
# titles render.
#
# env.SESSION_* stay so other flows can reuse the same canonical ids.
appId: com.dshext.companion
---
- assertVisible:
    id: "list-source"
- assertVisible:
    id: "list-menu"

# All canonical rows live in ONE list now (no tab filters).
- assertVisible:
    id: "session-row-sess-alpha"
- assertVisible: ".*Refactor gateway TLS.*"
- assertVisible:
    id: "session-row-sess-beta"
- assertVisible: ".*Release notes draft.*"

# Sections are collapsible in the UI; their hooks are built from a runtime key, so a flow cannot
# address them by a stable id — the rows below prove the section content rendered instead.

# The composer is the create-session entry point; it is present on the list screen.
- assertVisible:
    id: "list-composer-input"

# Sub-agent rows are hidden by default, with a reveal affordance when the host reports any.
- assertNotVisible:
    id: "session-row-sess-subagent"
