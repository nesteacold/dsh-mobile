# @dsh-mobile/bundle (spec 028): one Plugins entry for the dsh-mobile repository.
# GENERATED by bundle/scripts/sync-patch.mjs from plugins/<name>/cordis.patch.yml; edit those.
# Row ids, names and config are the plugins' own, so config stored by row id, paired devices,
# remotes and data directories are untouched, and each row keeps its own switch.

# ---- plugins/devices/cordis.patch.yml ----
# @dsh-ext/devices bundle patch (spec 008).
# Applied after dsh-base and dsh-web-app: inserts one row that consumes
# `webServer` and registers the `/devices` route prefix. It opens no listener of
# its own; the Devices page talks to the Host's loopback web server, and the
# plugin dials out (pinned WSS) to remote Hosts the user pairs.
- insert:
    - id: devices
      name: '@dsh-ext/devices'
      config:
        # Plugin data directory (remote records + one 0600 token file per remote).
        # Empty = ~/.dsh/devices-page.
        dataDir: ''
        # FR2: outbound pairing is limited to private/loopback/Tailscale addresses.
        # Set true only to pair with a Host that has a public wss:// endpoint.
        allowPublicRemotes: false
        # Spec 008 link supervisor: dial every stored remote at start-up and again
        # after an unexpected drop (1s, 2s, 5s, 10s, 30s, then 30s, ±20% jitter).
        # false = dial only when a route or the user asks (the old behaviour).
        autoReconnect: true
        # Backoff sequence in ms; the last value repeats forever. Every entry is
        # clamped to an integer in [100, 300000] ms before the ±20% jitter, and an
        # empty or invalid list falls back to the default below.
        reconnectDelaysMs: [1000, 2000, 5000, 10000, 30000]
        # How long a link must stay online before the backoff starts over, so a host
        # that greets and immediately drops keeps climbing the sequence instead of
        # being redialled at the first step forever. Clamped like the delays
        # ([100, 300000] ms; default 10000).
        reconnectStableMs: 10000
        # Spec 016 Phase 3 (contract revision 10): the "Browser (agent)" tab. This
        # machine lets a paired host drive an INSTALLED Chrome or Edge through
        # `--remote-debugging-pipe` (never a TCP port, never a download), one profile
        # per host under <dataDir>/agent-browser-profile/<remoteId>. Off by default and
        # then enabled per host on the Devices page ("Allow <host> to drive a browser
        # on this machine"). `false` removes the whole surface on this machine.
        agentBrowser: true
        # Optional explicit browser executable; empty = the standard Chrome/Edge
        # locations for this platform.
        agentBrowserPath: ''
        # Close an unused browser after this many ms (0 = never). Default 120000.
        agentBrowserIdleMs: 120000
        # Extra `host:port` values the agent may never open (this machine's own DSH
        # server is refused by default; the frame route also records the Host it is
        # served from, so the running app blocks itself without configuration).
        agentBrowserBlockedOrigins: []
        # Pairing-code QR (lib/pair-qr.mjs). `pwaUrl`: the externally served PWA
        # (https only); empty = https://<this node's MagicDNS name>:30443 when known.
        # `advertisedAddress`: host:port shown in the Pairing code dialog; empty =
        # the PWA host:30443 when the gateway is loopback-bound behind tailscale serve.
        pwaUrl: ''
        advertisedAddress: ''

# ---- plugins/mobile-gateway/cordis.patch.yml ----
# @dsh-ext/mobile-gateway bundle patch.
# Applied after dsh-base and dsh-web-app: inserts the persistent /ws/mobile
# gateway row into the host plane (it consumes `webServer`, the Host Remote
# Gateway and the `session/event` feed, and publishes no service of its own).
- insert:
    - id: mobile-gateway
      name: '@dsh-ext/mobile-gateway'
      config:
        # Secure by default: every mobile WebSocket must authenticate with a
        # paired device credential. Pair/revoke APIs remain local-machine only.
        # There is no `requireAuth` switch (T023): authentication is permanent.
        #
        # T011/T012: the owner switch. Off means the gateway accepts no
        # companion traffic at all (HTTP 403, error code `remote/disabled`) and
        # no non-loopback socket exists. `gatewayEnabled` is the legacy alias
        # and stays false; the plugin only starts enabled when this key is true.
        remoteControl:
          enabled: false
        gatewayEnabled: false
        # Optional startup mode: disabled | temporary | persistent.
        # Saved management-UI choices take precedence over startup config.
        # Remote control must also be enabled for any mode but `disabled`.
        # gatewayMode: persistent
        # gatewayName: Home PC
        # gatewayStateFile: /path/to/instance-gateway.json
        # Optional additional reachable addresses for this SAME gateway:
        # endpoints:
        #   - wss://gateway.example.com/ws/mobile
        gatewayWaitTimeoutMs: 300000
        adminLoopbackOnly: true
        pairingTtlMs: 300000
        # DSH WebUI remains loopback-only on 3080. The plugin-owned remote
        # listener is HTTPS + WSS only (T017/T018, FR-003): no plaintext remote
        # endpoint exists, and credentials are never accepted in a URL query
        # (T020/T023) — device authentication is permanent (FR-007).
        # The LAN listener is OFF by default (FR-001/SC-001): a default install
        # must not carry a non-loopback socket. When the owner turns remote
        # control on, the plugin binds 127.0.0.1 unless lanHost is changed
        # deliberately. lanPort 0 = ephemeral port.
        # T016 (R1): the self-signed certificate lives in
        # <deviceFile dir>/mobile-gateway-tls (override: tlsCertificateDir) and
        # is replaced only by POST /mgw/tls/regenerate (loopback only).
        lanEnabled: false
        lanHost: 127.0.0.1
        lanPort: 30081
        # tlsCertificateDir: /path/to/mobile-gateway-tls
        # v1 hard-disables the Cloudflare Tunnel and the `cloudflared` download
        # (T031, FR-011/R9): /mgw/cloudflare* answers 403 `cloudflare/disabled`,
        # `cloudflare.state` is always `disabled` (`hardDisabled: true`), and no
        # binary is fetched or spawned — so these three keys are inert. They stay
        # in the schema behind a compile-time flag for a future spec; do not set
        # `cloudflaredPath` expecting an external binary to be used in v1.
        # cloudflarePort: 3082
        # cloudflaredPath: /path/to/cloudflared
        # The public-IP setup Helper that writes this file is disabled in v1 too
        # (bin/setup-ip.mjs exits 1 for every command but --help), so under v1 the
        # file is only read if you create it yourself.
        publicUrlFile: /etc/dsh-mobile-gateway/public-url

# This bundle inserts only the gateway's own row. It deliberately does not
# patch `session-query-sqlite` or any other plugin's row (constitution A1):
# a non-insert patch assigns the target's whole `config`, so the gateway would
# override DSH's `openAt: never` default for every profile that installs it.
# Enabling the full-text session index is the owner's own patch-layer choice;
# see README.md ("Optional: Full-Text Session Search").

# ---- plugins/sidebar-browser/cordis.patch.yml ----
# @dsh-ext/sidebar-browser bundle patch (spec 014).
# Inserts one loader row. The plugin registers the model-facing `internal_browser_*`
# tools plus the two bridge routes the app window polls; it opens no listener of its
# own and speaks to the sidebar Browser tab through the window (C5).
- insert:
    - id: sidebar-browser
      name: '@dsh-ext/sidebar-browser'
      config:
        # No master switch (C2a): the session's permission preset is the switch. Under
        # Full access the tools run like any other tool; in every other preset a mutating
        # tool or eval asks for one-shot approval through DSH's own approval seam.
        # Where screenshots are written. Empty = <DSH_HOME>/sidebar-browser.
        # A tool's savePath is confined to this directory (C7); absolute paths and `..`
        # that resolve outside it are refused before anything runs.
        dataDir: ''
        # C6: a session whose origin cannot be determined is treated as remote and needs
        # the `browser:control` scope. DSH 0.2.2-rc.1 exposes no such signal to a plugin,
        # so a local owner states it here. Remote devices get the scope from the gateway
        # (`remoteSessionScope` service; see README).
        grantedScopes: []
        # Optional sidebar tab to pin by URL or title fragment; empty = the visible tab.
        tab: ''

